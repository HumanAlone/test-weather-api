<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌤️ Погода</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-500 via-blue-400 to-cyan-300 transition-all duration-1000">
    <div class="min-h-screen bg-black/10 backdrop-blur-sm">
        <!-- Header -->
        <header class="pt-8 pb-4 px-4">
            <div class="max-w-4xl mx-auto">
                <h1 class="text-white text-3xl font-light text-center mb-6">🌤️ Погода</h1>
                
                <!-- Search -->
                <div class="flex justify-center">
                    <div class="relative w-full max-w-md" id="search-container">
                        <input 
                            type="text" 
                            id="search-input"
                            placeholder="🔍 Введите город..."
                            class="w-full px-5 py-3 rounded-2xl bg-white/20 backdrop-blur-md border border-white/30 text-white placeholder-white/70 focus:outline-none focus:ring-2 focus:ring-white/50 text-lg"
                        >
                        <div id="search-loader" class="absolute right-4 top-1/2 -translate-y-1/2 hidden">
                            <div class="w-5 h-5 border-2 border-white/50 border-t-white rounded-full animate-spin"></div>
                        </div>
                        <div id="search-results" class="absolute top-full mt-2 w-full bg-white/95 backdrop-blur-lg rounded-2xl shadow-2xl overflow-hidden z-50 hidden"></div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Content -->
        <main class="max-w-4xl mx-auto px-4 pb-12">
            <!-- Loading -->
            <div id="loading" class="flex flex-col items-center justify-center py-20">
                <div class="w-16 h-16 border-4 border-white/30 border-t-white rounded-full animate-spin mb-4"></div>
                <p class="text-white/80 text-lg">Загрузка погоды...</p>
            </div>

            <!-- Error -->
            <div id="error" class="hidden bg-red-500/20 backdrop-blur-md border border-red-300/30 rounded-3xl p-8 text-center">
                <span class="text-4xl mb-4 block">⚠️</span>
                <p id="error-text" class="text-white text-lg"></p>
                <button onclick="loadWeather(55.7558, 37.6173, 'Москва', 'Россия')" 
                    class="mt-4 px-6 py-2 bg-white/20 hover:bg-white/30 rounded-xl text-white transition-colors">
                    Попробовать снова
                </button>
            </div>

            <!-- Weather Data -->
            <div id="weather-data" class="hidden space-y-6 animate-fade-in">
                <!-- Current Weather -->
                <div class="text-center text-white mb-8">
                    <div id="location" class="text-lg opacity-80 mb-1"></div>
                    <div id="weather-icon" class="text-7xl mb-4"></div>
                    <div id="temperature" class="text-8xl font-thin mb-2"></div>
                    <div id="description" class="text-2xl font-light mb-4"></div>
                    <div id="feels-like" class="text-lg opacity-80"></div>
                    
                    <div class="flex justify-center gap-8 mt-8">
                        <div class="flex flex-col items-center bg-white/10 rounded-2xl px-6 py-4 backdrop-blur-sm">
                            <span class="text-2xl mb-1">💨</span>
                            <span class="text-sm opacity-70">Ветер</span>
                            <span id="wind" class="font-medium"></span>
                        </div>
                        <div class="flex flex-col items-center bg-white/10 rounded-2xl px-6 py-4 backdrop-blur-sm">
                            <span class="text-2xl mb-1">💧</span>
                            <span class="text-sm opacity-70">Влажность</span>
                            <span id="humidity" class="font-medium"></span>
                        </div>
                        <div class="flex flex-col items-center bg-white/10 rounded-2xl px-6 py-4 backdrop-blur-sm">
                            <span class="text-2xl mb-1">🌡️</span>
                            <span class="text-sm opacity-70">Ощущается</span>
                            <span id="apparent" class="font-medium"></span>
                        </div>
                    </div>
                </div>

                <!-- Hourly Forecast -->
                <div class="bg-white/10 backdrop-blur-md rounded-3xl p-6 border border-white/20">
                    <h3 class="text-white text-lg font-medium mb-4">🕐 Почасовой прогноз</h3>
                    <div id="hourly" class="flex gap-4 overflow-x-auto pb-2 scrollbar-hide"></div>
                </div>

                <!-- Daily Forecast -->
                <div class="bg-white/10 backdrop-blur-md rounded-3xl p-6 border border-white/20">
                    <h3 class="text-white text-lg font-medium mb-4">📅 Прогноз на 7 дней</h3>
                    <div id="daily" class="space-y-2"></div>
                </div>

                <!-- Footer -->
                <div class="text-center text-white/50 text-sm pt-4">
                    Обновлено: <span id="update-time"></span>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ===== Утилиты =====
        function getWeatherDescription(code) {
            const d = {
                0: 'Ясно', 1: 'Преимущественно ясно', 2: 'Переменная облачность', 3: 'Пасмурно',
                45: 'Туман', 48: 'Изморозь', 51: 'Лёгкая морось', 53: 'Умеренная морось',
                55: 'Сильная морось', 61: 'Небольшой дождь', 63: 'Умеренный дождь', 65: 'Сильный дождь',
                71: 'Небольшой снег', 73: 'Умеренный снег', 75: 'Сильный снег', 80: 'Лёгкий ливень',
                81: 'Умеренный ливень', 82: 'Сильный ливень', 95: 'Гроза', 96: 'Гроза с градом', 99: 'Сильная гроза'
            };
            return d[code] || 'Неизвестно';
        }

        function getWeatherIcon(code) {
            if (code === 0) return '☀️';
            if (code === 1) return '🌤️';
            if (code === 2) return '⛅';
            if (code === 3) return '☁️';
            if (code === 45 || code === 48) return '🌫️';
            if (code >= 51 && code <= 55) return '🌦️';
            if (code >= 56 && code <= 67) return '🌧️';
            if (code >= 71 && code <= 77) return '🌨️';
            if (code >= 80 && code <= 82) return '🌧️';
            if (code >= 95) return '⛈️';
            return '🌡️';
        }

        function getWeatherGradient(code) {
            if (code === 0) return 'from-yellow-400 via-orange-400 to-blue-400';
            if (code <= 2) return 'from-blue-400 via-blue-300 to-yellow-200';
            if (code === 3) return 'from-gray-400 via-gray-500 to-blue-300';
            if (code === 45 || code === 48) return 'from-gray-300 via-gray-400 to-gray-500';
            if (code >= 51 && code <= 67) return 'from-blue-600 via-blue-500 to-gray-400';
            if (code >= 71 && code <= 86) return 'from-blue-200 via-blue-300 to-gray-300';
            if (code >= 95) return 'from-gray-700 via-purple-600 to-gray-800';
            return 'from-blue-400 via-blue-300 to-blue-200';
        }

        function getDayName(dateStr) {
            const date = new Date(dateStr);
            const today = new Date();
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);
            if (date.toDateString() === today.toDateString()) return 'Сегодня';
            if (date.toDateString() === tomorrow.toDateString()) return 'Завтра';
            return ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][date.getDay()];
        }

        // ===== Загрузка погоды =====
        async function loadWeather(lat, lon, cityName, country) {
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('error').classList.add('hidden');
            document.getElementById('weather-data').classList.add('hidden');

            try {
                const response = await fetch(`/api/weather?lat=${lat}&lon=${lon}`);
                if (!response.ok) throw new Error('Ошибка получения погоды');
                const data = await response.json();

                // Обновляем фон
                const gradient = getWeatherGradient(data.current.weather_code);
                document.body.className = `min-h-screen bg-gradient-to-br ${gradient} transition-all duration-1000`;

                // Текущая погода
                document.getElementById('location').textContent = `📍 ${cityName}, ${country}`;
                document.getElementById('weather-icon').textContent = getWeatherIcon(data.current.weather_code);
                document.getElementById('temperature').textContent = `${Math.round(data.current.temperature)}°C`;
                document.getElementById('description').textContent = getWeatherDescription(data.current.weather_code);
                document.getElementById('feels-like').textContent = `Ощущается как ${Math.round(data.current.apparent_temperature)}°C`;
                document.getElementById('wind').textContent = `${data.current.wind_speed} км/ч`;
                document.getElementById('humidity').textContent = `${data.current.humidity}%`;
                document.getElementById('apparent').textContent = `${Math.round(data.current.apparent_temperature)}°C`;

                // Почасовой прогноз
                const hourlyHtml = data.hourly.map(h => `
                    <div class="flex flex-col items-center min-w-[70px] bg-white/10 rounded-2xl p-3">
                        <span class="text-white/70 text-sm mb-2">${new Date(h.time).getHours().toString().padStart(2,'0')}:00</span>
                        <span class="text-2xl mb-2">${getWeatherIcon(h.weather_code)}</span>
                        <span class="text-white font-medium">${Math.round(h.temperature)}°</span>
                        <span class="text-white/50 text-xs mt-1">💧${h.humidity}%</span>
                    </div>
                `).join('');
                document.getElementById('hourly').innerHTML = hourlyHtml;

                // Дневной прогноз
                const dailyHtml = data.daily.map(d => `
                    <div class="flex items-center justify-between bg-white/5 hover:bg-white/15 rounded-2xl px-4 py-3 transition-colors">
                        <span class="text-white font-medium text-sm w-20">${getDayName(d.date)}</span>
                        <div class="flex items-center gap-2">
                            <span class="text-2xl">${getWeatherIcon(d.weather_code)}</span>
                            <span class="text-white/70 text-sm hidden sm:inline">${getWeatherDescription(d.weather_code)}</span>
                        </div>
                        <div class="flex items-center gap-4">
                            ${d.precipitation > 0 ? `<span class="text-blue-300 text-sm">💧${d.precipitation.toFixed(1)}мм</span>` : ''}
                            <div class="flex items-center gap-2">
                                <span class="text-white font-medium">${Math.round(d.temp_max)}°</span>
                                <span class="text-white/50">${Math.round(d.temp_min)}°</span>
                            </div>
                        </div>
                    </div>
                `).join('');
                document.getElementById('daily').innerHTML = dailyHtml;

                // Время обновления
                document.getElementById('update-time').textContent = new Date(data.current.time).toLocaleString('ru-RU');

                // Показываем данные
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('weather-data').classList.remove('hidden');

            } catch (error) {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error').classList.remove('hidden');
                document.getElementById('error-text').textContent = 'Не удалось загрузить погоду. Проверьте подключение к интернету.';
                console.error(error);
            }
        }

        // ===== Поиск города =====
        let searchTimeout;
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');
        const searchLoader = document.getElementById('search-loader');

        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();
            
            if (query.length < 2) {
                searchResults.classList.add('hidden');
                return;
            }

            searchLoader.classList.remove('hidden');
            searchTimeout = setTimeout(async () => {
                try {
                    const response = await fetch(`/api/search?query=${encodeURIComponent(query)}`);
                    const data = await response.json();
                    
                    if (data.results.length === 0) {
                        searchResults.classList.add('hidden');
                    } else {
                        const html = data.results.map(city => `
                            <button onclick="selectCity(${city.latitude}, ${city.longitude}, '${city.name}', '${city.country}')"
                                class="w-full px-5 py-3 text-left hover:bg-blue-50 border-b border-gray-100 last:border-0">
                                <div class="font-medium text-gray-800">${city.name}</div>
                                <div class="text-sm text-gray-500">${[city.admin1, city.country].filter(Boolean).join(', ')}</div>
                            </button>
                        `).join('');
                        searchResults.innerHTML = html;
                        searchResults.classList.remove('hidden');
                    }
                } catch (error) {
                    console.error(error);
                } finally {
                    searchLoader.classList.add('hidden');
                }
            }, 300);
        });

        function selectCity(lat, lon, name, country) {
            searchInput.value = `${name}, ${country}`;
            searchResults.classList.add('hidden');
            loadWeather(lat, lon, name, country);
        }

        // Закрываем результаты при клике вне
        document.addEventListener('click', (e) => {
            if (!document.getElementById('search-container').contains(e.target)) {
                searchResults.classList.add('hidden');
            }
        });

        // Загружаем Москву по умолчанию
        loadWeather(55.7558, 37.6173, 'Москва', 'Россия');
    </script>
</body>
</html>
